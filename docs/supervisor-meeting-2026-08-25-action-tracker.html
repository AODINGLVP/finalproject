        criteria: "设计章节与真实项目一致，读者能理解问题、方案和取舍。"
      },
      {
        id: "DIS-P0-10", category: "paper", priority: "P0", source: "导师意见 + 论文主旨",
        title: "把可玩游戏放在功能验证中",
        details: [
          "说明复杂行为树如何控制游戏敌人。",
          "用测试和场景证明节点、运行时、黑板、Decorator 和实时调试正确工作。",
          "不把行为树基础功能是否有用另设为研究问题。"
        ],
        criteria: "游戏证据证明平台可用，同时保持大型树显示优化为论文中心。"
      },
      {
        id: "DIS-P0-11", category: "paper", priority: "P0", source: "导师明确要求",
        title: "重写评价、讨论和结论",
        details: [
          "把定量实验与结构化开发者评价写成两类互补证据。",
          "从节点规模和物理屏幕尺寸两个方向讨论优化效果。",
          "区分测量结果、开发者观察和推论；讨论最有价值、有限和失败的功能。",
          "表达保持直白，术语首次出现立即解释。"
        ],
        criteria: "读者能回答项目做了什么、怎样评价、数据说明什么、最终推荐什么。"
      },
      {
        id: "DIS-P0-12", category: "paper", priority: "P0", source: "论文可靠性要求",
        title: "逐条核验引用和链接",
        details: [
          "确认资料真实存在，优先核对 DOI、出版方、正式会议或期刊页面。",
          "检查作者、标题、年份、出处、链接和正文支持关系。",
          "保证正文引用与参考文献表双向对应。"
        ],
        criteria: "所有引用真实可追溯、链接可打开、内容支持对应论述。"
      },
      {
        id: "DIS-P0-13", category: "paper", priority: "P0", source: "用户确定的流程",
        title: "保持 DOCX、LaTeX 和 PDF 内容一致",
        details: [
          "每轮先更新 DOCX，确认后同步 LaTeX，再由同版 LaTeX 生成 PDF。",
          "核对标题、正文、图表编号、引用和参考文献。",
          "使用日期或版本号保存可回退版本。"
        ],
        criteria: "同一版本的三种文件在结构、文字意义、编号和引用上保持一致。"
      },
      {
        id: "DIS-P0-14", category: "paper", priority: "P0", source: "导师明确允许",
        title: "准备并发送导师审阅稿",
        details: [
          "完成论文 P0 后生成编号明确的导师审阅 PDF。",
          "发送时请求优先检查实验方法、评价和讨论。",
          "预留修改时间并保存导师实际收到的版本。"
        ],
        criteria: "导师收到可独立阅读且版本明确的审阅稿。"
      },
      {
        id: "SUB-P0-01", category: "submission", priority: "P0", source: "学校提交要求",
        title: "按华威要求进行最终检查",
        details: [
          "对照 DISSERTATION_REQUIREMENTS.md 检查结构、格式、字数、图表、声明和提交要求。",
          "检查研究问题在各章一致，图表均被正文引用。",
          "确认没有把作者评价写成参与者实验，也没有把几何指标直接写成真人可用性证明。"
        ],
        criteria: "学校格式与学术表达检查全部完成，没有关键不一致。"
      },
      {
        id: "SUB-P0-02", category: "submission", priority: "P0", source: "版本与备份要求",
        title: "保存最终证据包和可回退版本",
        details: [
          "保存最终 DOCX、LaTeX、PDF、截图、原始数据和分析结果。",
          "文件名包含版本或日期，在 Git 中单独提交重要修改。",
          "确认远程备份不包含隐私会议资料或其他不应上传的文件。"
        ],
        criteria: "最终材料完整、命名清楚、能够恢复，且没有误上传隐私内容。"
      },
      {
        id: "LATER-P2-01", category: "later", priority: "P2", source: "提交后可选",
        title: "招募参与者进行正式用户研究",
        details: ["当前论文不编造参与者数据；提交后若继续研究，可使用已准备的协议开展真人实验。"],
        criteria: "不影响当前提交；只有真实招募和真实数据才可报告。"
      },
      {
        id: "LATER-P2-02", category: "later", priority: "P2", source: "提交后可选",
        title: "公开发布插件并收集外部反馈",
        details: ["可在提交后准备 Godot Asset Library 发布，根据真实用户反馈修复问题并决定保留哪些功能。"],
        criteria: "不占用当前论文 P0 工作时间。"
      },
      {
        id: "LATER-P2-03", category: "later", priority: "P2", source: "当前不作为重点",
        title: "扩大兼容性与性能优化",
        details: ["除非正确性被阻塞，否则当前不继续追求布局耗时；跨版本测试和进一步优化留到提交后。"],
        criteria: "仅在毕业论文提交后或出现明确需求时启动。"
      }
    ];

    const groups = {
      project: { title: "项目需要改进", description: "代码、交互、布局、连线和功能证据" },
      paper: { title: "论文需要改进", description: "相关研究、方法、截图、评价、讨论与引用" },
      submission: { title: "提交与复核", description: "学校要求、版本一致性和最终备份" },
      later: { title: "提交后再做", description: "不计入本次提交进度" }
    };

    const storageKey = "bt-supervisor-actions-2026-08-25-v1";
    let state = loadState();
    let allExpanded = false;

    function emptyState() {
      return { completed: {}, notes: {}, savedAt: null };
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey));
        return parsed && parsed.completed && parsed.notes ? parsed : emptyState();
      } catch (error) {
        return emptyState();
      }
    }

    function saveState() {
      state.savedAt = new Date().toISOString();
      localStorage.setItem(storageKey, JSON.stringify(state));
      updateProgress();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function filteredTasks() {
      const category = document.getElementById("categoryFilter").value;
      const status = document.getElementById("statusFilter").value;
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      return tasks.filter(task => {
        const done = Boolean(state.completed[task.id]);
        const haystack = [task.id, task.title, task.source, task.priority, task.criteria, ...task.details].join(" ").toLowerCase();
        return (category === "all" || task.category === category)
          && (status === "all" || (status === "done" ? done : !done))
          && (!query || haystack.includes(query));
      });
    }

    function taskMarkup(task) {
      const done = Boolean(state.completed[task.id]);
      const detailItems = task.details.map(item => `<li>${escapeHtml(item)}</li>`).join("");
      return `
        <article class="task${done ? " done" : ""}" data-task-id="${escapeHtml(task.id)}">
          <div class="task-top">
            <input class="task-check" type="checkbox" ${done ? "checked" : ""} aria-label="标记 ${escapeHtml(task.title)} 为完成">
            <div>
              <h3 class="task-title">${escapeHtml(task.title)}</h3>
              <div class="tags">
                <span class="tag tag-id">${escapeHtml(task.id)}</span>
                <span class="tag tag-${task.priority.toLowerCase()}">${escapeHtml(task.priority)}</span>
                <span class="tag tag-source">${escapeHtml(task.source)}</span>
              </div>
            </div>
          </div>
          <details ${allExpanded ? "open" : ""}>
            <summary>查看具体操作和完成标准</summary>
            <ul>${detailItems}</ul>
            <div class="criteria"><strong>完成标准：</strong>${escapeHtml(task.criteria)}</div>
          </details>
          <label class="notes">
            完成日期、证据文件、测试结果、论文页码或备注
            <textarea placeholder="例如：2026-08-27；截图路径；测试 250/250；论文第 4.3 节"></textarea>
          </label>
        </article>`;
    }

    function render() {
      const visible = filteredTasks();
      const root = document.getElementById("taskRoot");
      if (!visible.length) {
        root.innerHTML = '<div class="empty">当前筛选条件下没有任务。</div>';
        updateProgress();
        return;
      }

      root.innerHTML = Object.keys(groups).map(category => {
        const items = visible.filter(task => task.category === category);
        if (!items.length) return "";
        const completed = items.filter(task => state.completed[task.id]).length;
        return `
          <section class="group" data-group="${category}">
            <div class="group-heading">
              <h2>${groups[category].title}</h2>
              <span>${completed}/${items.length} · ${groups[category].description}</span>
            </div>
            <div class="task-list">${items.map(taskMarkup).join("")}</div>
          </section>`;
      }).join("");

      root.querySelectorAll(".task").forEach(card => {
        const id = card.dataset.taskId;
        const checkbox = card.querySelector(".task-check");
        const textarea = card.querySelector("textarea");
        textarea.value = state.notes[id] || "";
        checkbox.addEventListener("change", () => {
          state.completed[id] = checkbox.checked;
          saveState();
          render();
        });
        textarea.addEventListener("input", () => {
          state.notes[id] = textarea.value;
          saveState();
        });
      });
      updateProgress();
    }

    function setProgress(category, summaryId, barId) {
      const subset = tasks.filter(task => task.category === category);
      const done = subset.filter(task => state.completed[task.id]).length;
      document.getElementById(summaryId).textContent = `${done} / ${subset.length}`;
      document.getElementById(barId).style.width = subset.length ? `${done / subset.length * 100}%` : "0%";
    }

    function updateProgress() {
      const current = tasks.filter(task => task.category !== "later");
      const currentDone = current.filter(task => state.completed[task.id]).length;
      document.getElementById("currentSummary").textContent = `${currentDone} / ${current.length}`;
      document.getElementById("currentBar").style.width = current.length ? `${currentDone / current.length * 100}%` : "0%";
      setProgress("project", "projectSummary", "projectBar");
      setProgress("paper", "paperSummary", "paperBar");
      setProgress("submission", "submissionSummary", "submissionBar");
    }

    function exportState() {
      const payload = {
        tracker: "supervisor-meeting-2026-08-25",
        exportedAt: new Date().toISOString(),
        state
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `supervisor-action-progress-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function importState(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          const incoming = payload.state || payload;
          if (!incoming.completed || !incoming.notes) throw new Error("invalid");
          state = { completed: incoming.completed, notes: incoming.notes, savedAt: incoming.savedAt || null };
          saveState();
          render();
          alert("进度备份已导入。");
        } catch (error) {
          alert("无法导入：这不是本看板生成的有效进度文件。");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    document.getElementById("categoryFilter").addEventListener("change", render);
    document.getElementById("statusFilter").addEventListener("change", render);
    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("printButton").addEventListener("click", () => window.print());
    document.getElementById("exportButton").addEventListener("click", exportState);
    document.getElementById("importInput").addEventListener("change", event => {
      if (event.target.files[0]) importState(event.target.files[0]);
      event.target.value = "";
    });
    document.getElementById("expandButton").addEventListener("click", event => {
      allExpanded = !allExpanded;
      event.target.textContent = allExpanded ? "收起全部说明" : "展开全部说明";
      render();
    });
    document.getElementById("resetButton").addEventListener("click", () => {
      if (!confirm("确定要清空所有勾选和备注吗？建议先导出进度备份。")) return;
      state = emptyState();
      saveState();
      render();
    });

    render();
  </script>
</body>
</html>
